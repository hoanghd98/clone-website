version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: clone_website_web
    ports:
      - "3000:3000"
    volumes:
      # Mount the sqlite db and uploads directory to persist data
      - database:/app/prisma
      - ../public/uploads:/app/public/uploads
    # environment:
      # NODE_ENV: production
    command: npm run dev
    restart: unless-stopped

volumes:
  database:
