services:
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: clone_website_web
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      # Only the folder that holds dev.db (+ .generated-env). Gitignored; checkout clean:false keeps it.
      - ../data:/app/data
      - ../public/uploads:/app/public/uploads
    restart: unless-stopped

  # Optional Postgres: docker compose --profile postgres up -d
  # Then set DATABASE_URL=postgresql://namphuong:namphuong@localhost:5432/namphuong?schema=public
  db:
    image: postgres:16-alpine
    container_name: clone_website_db
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: namphuong
      POSTGRES_PASSWORD: namphuong
      POSTGRES_DB: namphuong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional MySQL: docker compose --profile mysql up -d
  # Then set DATABASE_URL=mysql://namphuong:namphuong@localhost:3306/namphuong
  mysql:
    image: mysql:8.4
    container_name: clone_website_mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: namphuong
      MYSQL_USER: namphuong
      MYSQL_PASSWORD: namphuong
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  postgres_data:
  mysql_data:
